server:
  port: 8088

spring:
  application:
    name: compliance-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/compliance_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081

  cache:
    type: redis
    redis:
      time-to-live: 300000 # 5 minutes

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: compliance-service
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  compliance:
    aml:
      monitoring:
        enabled: true
        batch-size: 100
        processing-interval: 60000 # 1 minute
        risk-thresholds:
          high-risk-amount: 10000
          medium-risk-amount: 5000
          low-risk-amount: 1000
        patterns:
          - name: "Large Transaction"
            description: "Transaction exceeding high risk threshold"
            threshold: 10000
            severity: "HIGH"
          - name: "Rapid Successive Transactions"
            description: "Multiple transactions within short time period"
            threshold: 5
            time-window: 300000 # 5 minutes
            severity: "MEDIUM"
          - name: "Unusual Time Pattern"
            description: "Transactions outside normal business hours"
            threshold: 0
            severity: "LOW"
          - name: "Geographic Anomaly"
            description: "Transactions from unusual geographic locations"
            threshold: 0
            severity: "MEDIUM"
    
    fraud:
      detection:
        enabled: true
        real-time-monitoring: true
        machine-learning-enabled: false
        rules:
          - name: "Velocity Check"
            description: "Multiple transactions in short time"
            enabled: true
          - name: "Amount Anomaly"
            description: "Unusual transaction amounts"
            enabled: true
          - name: "Location Anomaly"
            description: "Transactions from unusual locations"
            enabled: true
          - name: "Device Anomaly"
            description: "Transactions from new or suspicious devices"
            enabled: true
    
    reporting:
      regulatory:
        enabled: true
        formats:
          - "SAR" # Suspicious Activity Report
          - "CTR" # Currency Transaction Report
          - "BSA" # Bank Secrecy Act
        retention-years: 5
        auto-generation: true
        notification-enabled: true
    
    audit:
      logging:
        enabled: true
        level: "INFO"
        include-request-body: true
        include-response-body: false
        sensitive-fields:
          - "password"
          - "ssn"
          - "accountNumber"
          - "routingNumber"
        retention-days: 2555 # 7 years
    
    data-retention:
      policies:
        - entity: "transactions"
          retention-years: 7
          archive-after-years: 5
          delete-after-years: 7
        - entity: "audit_logs"
          retention-years: 7
          archive-after-years: 5
          delete-after-years: 7
        - entity: "customer_data"
          retention-years: 10
          archive-after-years: 7
          delete-after-years: 10
        - entity: "kyc_documents"
          retention-years: 5
          archive-after-years: 3
          delete-after-years: 5
      cleanup:
        enabled: true
        schedule: "0 2 * * *" # Daily at 2 AM
        batch-size: 1000

logging:
  level:
    com.yourorg.banking.compliance: DEBUG
    org.springframework.security: DEBUG
    org.springframework.kafka: INFO

