server:
  port: 8085

spring:
  application:
    name: card-service
  datasource:
    url: jdbc:postgresql://localhost:5432/card_service
    username: card_user
    password: card_pass
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9080/realms/dbf
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: card-service
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serialization.JsonSerializer

app:
  card:
    pan-length: 16
    cvv-length: 3
    expiry-years: 5
    max-cards-per-customer: 5
    default-spending-limit: 10000.00
    default-daily-limit: 1000.00
    default-monthly-limit: 5000.00
  security:
    pin-hash-salt: "card-pin-salt"
    card-number-encryption-key: "card-encryption-key-32-chars"
  notifications:
    enabled: true
    email-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.yourorg.banking.card: DEBUG
    org.springframework.security: DEBUG

