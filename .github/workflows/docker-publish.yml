name: Docker Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/digital-banking-fintech

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        run: |
          docker build -t $REGISTRY/${{ env.IMAGE_NAMESPACE }}-customer-service:${{ github.ref_name }} services/customer-service
          docker build -t $REGISTRY/${{ env.IMAGE_NAMESPACE }}-account-service:${{ github.ref_name }} services/account-service
          docker build -t $REGISTRY/${{ env.IMAGE_NAMESPACE }}-ledger-service:${{ github.ref_name }} services/ledger-service
          docker build -t $REGISTRY/${{ env.IMAGE_NAMESPACE }}-api-gateway:${{ github.ref_name }} services/api-gateway

      - name: Push images
        run: |
          docker push $REGISTRY/${{ env.IMAGE_NAMESPACE }}-customer-service:${{ github.ref_name }}
          docker push $REGISTRY/${{ env.IMAGE_NAMESPACE }}-account-service:${{ github.ref_name }}
          docker push $REGISTRY/${{ env.IMAGE_NAMESPACE }}-ledger-service:${{ github.ref_name }}
          docker push $REGISTRY/${{ env.IMAGE_NAMESPACE }}-api-gateway:${{ github.ref_name }}
